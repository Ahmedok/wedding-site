version: '3.8'

services:
  backend:
    build: ./backend
    container_name: wedding-backend
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - sqlite-data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqlite-data:
    driver: local
